name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Caches Gradle downloads AND respects the version pinned in
      # gradle/wrapper/gradle-wrapper.properties -- works together with
      # ./gradlew below rather than replacing it, so the build uses the
      # exact same Gradle/AAPT2 pairing your local Android Studio uses.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Forces a completely fresh cache this run, since the first two
          # failed attempts (before the wrapper existed) may have left a
          # corrupted dependency cache behind -- same root cause as the
          # local Android Studio issue that "Invalidate Caches" fixed.
          cache-write-only: true

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Diagnostic step: prints exactly which versions of these 3 libraries
      # actually got resolved, and whether their resources were extracted.
      # This never fails the build (continue-on-error) -- it just gives us
      # real data instead of guessing further.
      - name: Diagnose dependency resolution
        continue-on-error: true
        run: |
          echo "---- Dependency tree for the 3 suspect libraries ----"
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath | grep -i -A2 -E "constraintlayout|material:|media3-ui" || true
          echo "---- Checking extracted AAR resources exist ----"
          find ~/.gradle/caches -iname "*constraintlayout*" -o -iname "*material-1.12*" -o -iname "*media3-ui*" 2>/dev/null | head -30

      - name: Build release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_SIGNING_SECRET: ${{ secrets.APP_SIGNING_SECRET }}
          FALLBACK_API_URL: ${{ secrets.FALLBACK_API_URL }}
        run: ./gradlew assembleRelease --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
